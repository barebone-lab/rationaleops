name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/gh-pages/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: "Build & publish to gh-pages branch"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/gh-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/gh-pages/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/gh-pages/dist
          publish_branch: gh-pages
          commit_message: "Deploy ${{ github.sha }}"
