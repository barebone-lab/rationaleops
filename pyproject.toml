[project]
name = "rationaleops"
version = "0.1.0"
description = "A DataHub-grounded Cognitive Task Analysis agent for hidden business logic"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "acryl-datahub>=1.6.0.15",
    "duckdb>=1.3.0",
    "pydantic>=2.10.0",
    "sqlglot>=27.0.0",
]

[project.scripts]
rationaleops = "rationaleops.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rationaleops"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
