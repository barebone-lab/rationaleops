[project]
name = "rationaleops"
version = "0.1.0"
description = "A DataHub-grounded Cognitive Task Analysis agent for hidden business logic"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "acryl-datahub>=1.6.0.15",
    "duckdb>=1.3.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "openai>=1.70.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "sqlglot>=27.0.0",
    "uvicorn>=0.34.0",
]

[project.scripts]
rationaleops = "rationaleops.cli:main"
rationaleops-api = "rationaleops.api:run"

[project.optional-dependencies]
mcp = [
    "mcp>=1.20.0",
    "mcp-server-datahub>=0.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rationaleops"]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/src/rationaleops",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
